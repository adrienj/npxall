services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
    # No cap_add / no unconfined seccomp: those existed only so bubblewrap could
    # create namespaces. Execution now happens in V8 isolates inside the process,
    # so the container needs no elevated privilege — and since this service runs
    # attacker-supplied code, the default seccomp/AppArmor profiles are the outer
    # boundary that must stay ON.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    # See the api service: the bubblewrap-era privileges are no longer needed.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
